 // 선택 강조 테두리만 오버레이(상태 가변분)
 if(sel){ const round=(n.group==='person');
  ctx.beginPath(); if(round) ctx.arc(n.x,n.y,r,0,7); else rr(ctx,n.x-r,n.y-r,r*2,r*2,8);
  ctx.lineWidth=3; ctx.strokeStyle='#1f6feb'; ctx.stroke(); }
 // ★소속국 뱃지 — 노드 하단 모서리에 작은 국기(국가노드 대체). 최대 4개, 나머지는 +N.
 if(n.cbadge && n.cbadge.length && al>0.3){   // ★국기뱃지는 움직임 중에도 유지(사라지면 거슬림)
  const bs=Math.max(12,r*0.52), show=Math.min(4,n.cbadge.length);
  const totW=show*bs*0.82+(n.cbadge.length>4?bs*0.9:0), bx0=n.x-totW/2+bs/2, by=n.y+r-bs*0.32;
  for(let i=0;i<show;i++){ const cb=n.cbadge[i], bx=bx0+i*bs*0.82;
   const fi=cb.flag?img(cb.flag):null;
   ctx.beginPath(); ctx.arc(bx,by,bs/2,0,7); ctx.fillStyle='#0a0e17'; ctx.fill();
   if(fi&&fi.complete&&fi.naturalWidth){ ctx.save(); ctx.beginPath(); ctx.arc(bx,by,bs/2-1,0,7); ctx.clip();
    const s=Math.max(bs/fi.naturalWidth,bs/fi.naturalHeight);
    ctx.drawImage(fi,bx-fi.naturalWidth*s/2,by-fi.naturalHeight*s/2,fi.naturalWidth*s,fi.naturalHeight*s); ctx.restore(); }
   ctx.beginPath(); ctx.arc(bx,by,bs/2,0,7); ctx.lineWidth=1.3; ctx.strokeStyle='#e9edf3'; ctx.stroke(); }
  if(n.cbadge.length>4){ ctx.fillStyle='#cdd8e6'; ctx.font='700 '+(bs*0.62)+'px Pretendard';
   ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('+'+(n.cbadge.length-4), bx0+show*bs*0.82, by); }
 }
 // 라벨(하단) — ★shadowBlur는 노드마다 걸면 매우 비싸다(191개=렉 주범). 얇은 외곽선으로 대체.
 const fs=Math.max(10,12/Math.max(1,scale*0.9)), lbl=fit(n.label,14);
 ctx.font='600 '+fs+'px Pretendard'; ctx.textAlign='center'; ctx.textBaseline='top';
 ctx.lineWidth=Math.max(2,fs*0.28); ctx.strokeStyle='rgba(6,9,14,.9)'; ctx.lineJoin='round';
 ctx.strokeText(lbl, n.x, n.y+r+3);
 ctx.fillStyle='#e9edf3'; ctx.fillText(lbl, n.x, n.y+r+3);
 n.__w=r*2; n.__h=r*2; ctx.restore();
}
// ── 노드 스프라이트 캐시(배경+이미지+기본테두리). 이미지 로드 완료 여부로만 무효화. ──
const SPAD=6, _spr={};
function nodeSprite(n){
 const im=n.img?img(n.img):null;
 const imk=(im&&im.complete&&im.naturalWidth)?1:0;
 const ex=_spr[n.id]; if(ex && ex.imk===imk) return ex;
 const r=rad(n), round=(n.group==='person');
 const S=Math.ceil((r+SPAD)*2*HIDPI);
 const c=(ex&&ex.c)||document.createElement('canvas'); c.width=S; c.height=S;
 const x=c.getContext('2d'); x.setTransform(HIDPI,0,0,HIDPI,0,0);
 const cx=r+SPAD, cy=r+SPAD;
 x.beginPath(); if(round) x.arc(cx,cy,r,0,7); else rr(x,cx-r,cy-r,r*2,r*2,8);
 x.fillStyle=n.group==='country'?'#0d1520':'#f4f6fa'; x.fill();
 x.lineWidth=n.keystone_badge?4:1.5;
 x.strokeStyle=n.keystone_badge?'#ffd23f':(V[n.verdict]||'#3a4657'); x.stroke();
 if(imk){ x.save(); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.beginPath();
  if(round) x.arc(cx,cy,r-2,0,7); else rr(x,cx-r+2,cy-r+2,r*2-4,r*2-4,6); x.clip();
  const cov=(n.group==='country'||n.group==='person');
  const sc=cov?Math.max((r*2-4)/im.naturalWidth,(r*2-4)/im.naturalHeight)
              :Math.min((r*2-4)/im.naturalWidth,(r*2-4)/im.naturalHeight);
  const W=im.naturalWidth*sc, H=im.naturalHeight*sc;
  x.drawImage(im,cx-W/2,cy-H/2,W,H); x.restore();
 } else { x.fillStyle=n.group==='country'?'#c9d4e3':'#1a2230'; x.font='700 '+Math.max(9,r*0.4)+'px Pretendard';
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(fit(n.label,6),cx,cy); }
 _spr[n.id]={c,imk,S}; return _spr[n.id];
}
function paintNode(n,color,ctx){ const w=n.__w||52,h=n.__h||52; ctx.fillStyle=color; ctx.fillRect(n.x-w/2,n.y-h/2,w,h); }

// ── 선 렌더 (여명의 빛 라벨 박스) ──
function drawLink(l,ctx,scale){
 const s=l.source,t=l.target; if(!s.x||!t.x) return;
 if(!_baking){ if(_useBake) return;          // ★팬(이미지 사용) 중엔 벡터 스킵 — 줌 중엔 벡터로 그림
  if(l._path && !segInVP(l._path)) return; }  // ★경로 bbox 화면 밖 스킵(베이크 땐 전체)
 const dimS=(curTr!=='all'&&s.track!==curTr&&t.track!==curTr);
 const foc=selId||hoverId;
 const active=(selLink===l)||(foc&&(l.from===foc||l.to===foc));
 // ★직교 라우팅으로 안 겹치니 선을 보이게 한다. 포커스 중엔 무관 선만 죽임.
 let al;
 if(dimS) al=0.04;
 else if(active) al=0.98;
 else if(foc) al=0.05;              // 다른 노드 포커스 중 — 무관 선 죽임
 else al=l.keystone?0.85:(l.verdict==='확립'?0.42:(l.verdict==='반증'||l.verdict==='배제'?0.45:0.24));
 const col=V[l.verdict]||'#57606a';
 const banz=(l.verdict==='반증'||l.verdict==='배제');
 const w=(active?1.5:1)*(l.keystone?4:(l.verdict==='확립'?2.4:1.7));   // ★선 부피(두께)
 const P=l._path||[[s.x,s.y],[t.x,t.y]];
 // ★★움직임 중 — 거의 안 보이는 잔선은 통째 스킵하고, 남는 선은 색선 직선만(외곽선·arcTo·화살표 생략).
 //   drawLink가 렉의 주범이라 팬/줌 프레임에선 선당 stroke 1회·path 최소화한다.
 if(_moving){
  // ★움직임 중엔 중요선(확립·급소·반증·배제·active)만 직선으로 — 잔선(정황약·단서·미입증) 스킵해 stroke 격감
  if(!(active||l.keystone||l.verdict==='확립'||l.verdict==='반증'||l.verdict==='배제')) return;
  ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length;i++) ctx.lineTo(P[i][0],P[i][1]);
  ctx.stroke(); ctx.restore(); return;
 }
 ctx.save(); ctx.globalAlpha=al;
 ctx.lineJoin='round'; ctx.lineCap='round';
 const RAD=10;
 function trace(){ ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length-1;i++) ctx.arcTo(P[i][0],P[i][1],P[i+1][0],P[i+1][1],RAD);
  ctx.lineTo(P[P.length-1][0],P[P.length-1][1]); ctx.stroke(); }
 // ★부피감 — 어두운 외곽선을 먼저 두껍게 깔고, 색선을 위에. 겹쳐도 선이 구분된다(정지 시).
 if(l.verdict==='배제') ctx.setLineDash([7,5]);
 ctx.strokeStyle='#0a0e17'; ctx.lineWidth=w+2.6; trace();
 ctx.strokeStyle=col; ctx.lineWidth=w; trace();
 ctx.setLineDash([]);
 // 화살표·⊘는 활성 or 급소 or 반증일 때만(잔선엔 생략해 깔끔) — pathMid도 이때만 계산
 if(active||l.keystone||banz){
  const _m=pathMid(l), mx=_m[0], my=_m[1];
  const p1=P[P.length-2], p2=P[P.length-1];
  const ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]), r=rad(t);
  const ax=p2[0]-Math.cos(ang)*r, ay=p2[1]-Math.sin(ang)*r, hl=9;
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(ax,ay); ctx.lineTo(ax-Math.cos(ang-0.4)*hl,ay-Math.sin(ang-0.4)*hl);
  ctx.lineTo(ax-Math.cos(ang+0.4)*hl,ay-Math.sin(ang+0.4)*hl); ctx.closePath(); ctx.fill();
  if(banz){ ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(mx,my,7,0,7); ctx.stroke();
   ctx.beginPath(); ctx.moveTo(mx-5,my-5); ctx.lineTo(mx+5,my+5); ctx.stroke(); }
 }
 ctx.restore();
}
// ── 선 라벨 — 선·노드 위(최상위)에 그려 부피가 확실하고 다음 선에 안 덮인다. onRenderFramePost에서 일괄. ──
function drawLabel(l,ctx,scale){
 const banz=(l.verdict==='반증'||l.verdict==='배제'), sel=(selLink===l);
 const m=pathMid(l), mx=m[0], my=m[1];
 const fs=Math.max(10.5, 11.5/Math.max(1,scale*0.75));
 ctx.font='600 '+fs+'px Pretendard'; const tw=ctx.measureText(l.label).width;
 const pad=6, bw=tw+pad*2, bh=fs+7, oy=banz?14:0;
 ctx.globalAlpha=1;
 ctx.fillStyle=banz?'#3a1418':(l.keystone?'#463405':'#0f1622');
 rr(ctx,mx-bw/2,my-bh/2+oy,bw,bh,5); ctx.fill();
 ctx.strokeStyle=l.keystone?'#ffd23f':(banz?'#ff5555':(sel?'#1f6feb':'#39465c')); ctx.lineWidth=sel?1.8:1.1; ctx.stroke();
 ctx.fillStyle=l.keystone?'#ffd23f':'#dbe4f0'; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText(l.label, mx, my+oy);
}
G.onRenderFramePost((ctx,scale)=>{ if(!showLabel) return; if(_useBake) return;   // ★팬(이미지) 중엔 라벨이 이미 이미지에 포함 → 벡터 라벨 스킵. 줌 중엔 벡터 라벨.
 ctx.save(); ctx.lineJoin='round';
 _labelSet.forEach(l=>{ if(l.source&&l.source.x!=null) drawLabel(l,ctx,scale); });
 ctx.restore();
});

// ── ★정적 베이크 — 레이아웃 확정분을 오프스크린에 1회 렌더, 팬 중엔 이 이미지만 이동(사진처럼) ──
function drawRooms(ctx,scale){
 bands.forEach(b=>{ const dim=(curTr!=='all'&&b.tr!==curTr); const c=PCOL[b.tr];
  ctx.save(); ctx.globalAlpha=dim?0.22:0.66;
  ctx.fillStyle=c.tx; ctx.font='800 '+(24/Math.max(.4,scale))+'px Pretendard'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(b.p, (b.x0+b.x1)/2, b.y0-12/Math.max(.4,scale)); ctx.restore(); });
}
function bakeStatic(sc){
 try{ sc=sc||1;
  if(_bake && _bake.bmp){ try{ _bake.bmp.close(); }catch(e){} }
  // ★전체 월드를 1회 저해상으로 굽는다 — 팬/줌 반복해도 재베이크 없음(줌인 렉 제거). GPU상주(bmp)라 흐려도 blit 순간, 정지 시 벡터로 선명.
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n=>{ if(n.x==null)return; const r=rad(n)+90;
   if(n.x-r<x0)x0=n.x-r; if(n.y-r<y0)y0=n.y-r; if(n.x+r>x1)x1=n.x+r; if(n.y+r>y1)y1=n.y+r; });
  if(x0>x1) return;
  const pad=200; x0-=pad; y0-=pad; x1+=pad; y1+=pad;
  const W=x1-x0, H=y1-y0;
  let BS=1; while(W*H*BS*BS>4.5e6 && BS>0.02) BS*=0.8;   // 전체월드 4.5MP 상한(1회·GPU상주)
  const cw=Math.max(1,Math.round(W*BS)), ch=Math.max(1,Math.round(H*BS));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d'); x.setTransform(BS,0,0,BS,-x0*BS,-y0*BS);
  _baking=true;
  drawRooms(x,sc);
  links.forEach(l=>drawLink(l,x,sc));
  nodes.forEach(n=>drawNode(n,x,sc));
  if(showLabel) _labelSet.forEach(l=>{ if(l.source&&l.source.x!=null) drawLabel(l,x,sc); });
  _baking=false;
  _bake={c,x0,y0,W,H,scale:sc,bmp:null};
  // ★GPU 상주 텍스처로 변환 — 팬 중 매 프레임 CPU→GPU 재업로드(유튜브 GPU 경합 주범)를 없앤다
  try{ createImageBitmap(c).then(b=>{ if(_bake && _bake.c===c) _bake.bmp=b; }).catch(()=>{}); }catch(e){}
 }catch(e){ _baking=false; }
}

// ── 유틸 ──
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fit(s,n){ s=(s||'').replace(/\n/g,' '); return s.length>n? s.slice(0,n-1)+'…':s; }
// 상태변경시 1프레임 리드로만 예약(rAF 디바운스). nodeCanvasObject는 triggerUpdate:false라
// 같은 함수 재설정이 데이터 재구축 없이 다음 프레임 리페인트만 건다.
let _rq=false;
function redraw(){ if(!G||_rq) return; _rq=true; _bake=null;   // ★상태변경(선택·필터·트랙·라벨) → 베이크 폐기(현재 상태로 재굽기)
 requestAnimationFrame(()=>{ _rq=false; try{ G.nodeCanvasObject(drawNode); }catch(e){} }); }

// ── 인터랙션 ──
function openNode(n){ selId=n.id; selLink=null; buildAdj(); const b=document.getElementById('pbody');
 const claims=links.filter(l=>l.from===n.id||l.to===n.id);
 b.innerHTML='<h2>'+esc(n.label.replace(/\n/g,' '))+'</h2>'+
  '<div class=meta>'+({aweb:'A-WEB 축',fraud:'부정선거 축',bridge:'교차'}[n.track]||'')+' · '+esc(n.pillar||'')+
  ' · <span class="vpill v-'+n.verdict+'">'+n.verdict+'</span></div>'+
  (n.cbadge&&n.cbadge.length?'<div class=gist style="font-size:12px;color:#9fb0c6">진출·소속국: '+n.cbadge.map(c=>esc(c.label.split('(')[0])).join(' · ')+'</div>':'')+
  (n.badges&&n.badges.length?'<div class=gist>'+n.badges.map(esc).join('<br>')+'</div>':'')+
  '<div class=claims><b style="font-size:11px;color:#8ea3bd">이 실체가 걸린 관계 '+claims.length+'건</b>'+
   claims.slice(0,8).map(l=>'<div class=c>'+esc(l.label)+'</div>').join('')+'</div>'+
  '<a class=warp href="통합맵.html#'+n.id+'" target=_blank>3D에서 근거·증거 보기 →</a>';
 document.getElementById('panel').classList.add('on'); redraw();
}
function openLink(l){ selId=null; selLink=l; buildAdj(); const b=document.getElementById('pbody');
 const cs=(l.claims||[]);
 b.innerHTML='<h2>'+esc((l.source.label||l.from).replace(/\n/g,' '))+' → '+esc((l.target.label||l.to).replace(/\n/g,' '))+'</h2>'+
  '<div class=meta><span class="vpill v-'+l.verdict+'">'+l.verdict+'</span>'+(l.keystone?' · <span class="vpill" style="background:#4a3a08;color:#ffd23f">급소</span>':'')+'</div>'+
  '<div class=gist>'+esc(l.label)+'</div>'+
  '<div class=claims><b style="font-size:11px;color:#8ea3bd">근거 명제 '+cs.length+'건 (상세는 3D)</b>'+
   (cs.length?cs.map(c=>'<div class=c>'+esc(c)+'</div>').join(''):'<div class=c style=color:#6b7a90>직접 관계 — 접힌 명제 없음</div>')+'</div>'+
  '<a class=warp href="통합맵.html" target=_blank>3D에서 이 관계 보기 →</a>';
 document.getElementById('panel').classList.add('on'); redraw();
}
function closeP(){ document.getElementById('panel').classList.remove('on'); selId=null; selLink=null; buildAdj(); redraw(); }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ── 컨트롤 ──
document.querySelectorAll('#ctl button[data-tr]').forEach(b=>b.onclick=()=>{
 curTr=b.dataset.tr; document.querySelectorAll('#ctl button[data-tr]').forEach(x=>x.classList.toggle('on',x===b)); redraw(); });
document.getElementById('lbltog').onclick=function(){ showLabel=!showLabel;
 this.textContent='선 라벨 '+(showLabel?'ON':'OFF');
 this.style.background=showLabel?'#1f6feb':'#131a26'; this.style.color=showLabel?'#fff':'#c9d4e3';
 this.style.borderColor=showLabel?'#1f6feb':'#2a3547'; redraw(); };
// 딥링크 #id
function gotoNode(id){ const n=nodes.find(x=>x.id===decodeURIComponent(id));
 if(n){ openNode(n); G.centerAt(n.x,n.y,800); G.zoom(2.2,800); } return !!n; }
if(location.hash) setTimeout(()=>gotoNode(location.hash.slice(1)),1400);
window.__dbg=()=>({selId,hoverId,adjN:_adjN.size,nnodes:nodes.length,
 routed:links.filter(l=>l._path).length, nlinks:links.length,
 samp:links.slice(0,2).map(l=>({f:l.from,t:l.to,sx:l.source&&l.source.x,path:l._path}))});
window.__focus=gotoNode;
</script></body></html>
